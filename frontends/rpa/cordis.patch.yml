# Built-in ClawMaster RPA: the governed automation control plane recovered from
# the pre-DSH line. It registers one model-facing tool over a durable, revision-
# checked run store. External side effects are denied outright until an approval
# bridge exists, so an unattended session cannot drive a browser.
- insert:
    - id: clawmaster-rpa
      name: '@clawmaster/dsh-rpa'
