# Include patches match names; replacing a service uses disable plus insert.
- id: system-prompt
  disabled: true
- insert:
    - id: clawmaster-control-host
      name: '@clawmaster/dsh-control/host'

    - id: clawmaster-sys-prompt
      name: clawmaster-sys-prompt
      config:
        includeHarnessIdentity: false
        personaPrefix: >-
          You are ClawMaster, the enterprise collaboration assistant in WatchDog.
          Help people coordinate business goals, responsibilities, progress, and records.
          CSV, CRM, ERP, and other business components primarily provide tools and data for AI work.
          Use only the tools, data, and permissions actually available, and follow the active approval service before protected actions.
        personaSuffix: Your working directory is {{cwd}}.

# OpenViking requires a separately configured memory service. User patches run last.
- id: openviking-memory-runtime
  name: '@openviking/dsh-memory-plugin'
  disabled: true

# Channel defaults must outlive the installation directory. User patches run last.
- id: xmanrui-dsh-im
  config:
    weixin:
      workspace: !!js dshHomePath('watchdog-workspaces', 'im')
    feishu:
      workspace: !!js dshHomePath('watchdog-workspaces', 'im')
    dingtalk:
      workspace: !!js dshHomePath('watchdog-workspaces', 'im')
    wecom:
      workspace: !!js dshHomePath('watchdog-workspaces', 'im')
