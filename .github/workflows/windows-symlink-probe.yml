# 临时探针：在真实 Windows runner 上确定「哪种复制方式能保留符号链接」。
# 由 push 本文件触发（workflow_dispatch 只对默认分支生效）。
# 结论用于修正 desktop-release.yml 的「Verify fresh production installation」步骤。
name: Windows symlink copy probe

on:
  push:
    paths:
      - '.github/workflows/windows-symlink-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Who am I / symlink privilege
        shell: pwsh
        run: |
          whoami
          whoami /groups | Select-String -Pattern 'Administrators|Mandatory Label' | ForEach-Object { $_.Line }
          fsutil behavior query SymlinkEvaluation 2>&1 | Out-String

      - name: Can we create a symlink at all? (cmd mklink)
        shell: cmd
        continue-on-error: true
        run: |
          mkdir %RUNNER_TEMP%\probe-mklink\target 2>nul
          echo hi > %RUNNER_TEMP%\probe-mklink\target\f.txt
          mklink %RUNNER_TEMP%\probe-mklink\filelink.txt %RUNNER_TEMP%\probe-mklink\target\f.txt
          mklink /D %RUNNER_TEMP%\probe-mklink\dirlink %RUNNER_TEMP%\probe-mklink\target
          dir %RUNNER_TEMP%\probe-mklink
          echo MKLINK_EXIT=%ERRORLEVEL%

      - name: Can we create a symlink via bash ln -s (default MSYS)?
        shell: bash
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/probe-ln"; mkdir -p "$RUNNER_TEMP/probe-ln/pkg/bin"
          echo content > "$RUNNER_TEMP/probe-ln/pkg/bin/tool.js"
          ln -s ../pkg/bin/tool.js "$RUNNER_TEMP/probe-ln/link.js" && echo LN_FILE_OK || echo LN_FILE_FAIL
          ln -s pkg "$RUNNER_TEMP/probe-ln/dirlink" && echo LN_DIR_OK || echo LN_DIR_FAIL
          ln -s ../nowhere "$RUNNER_TEMP/probe-ln/dangling" && echo LN_DANGLING_OK || echo LN_DANGLING_FAIL
          echo "--- find -type l count:"; find "$RUNNER_TEMP/probe-ln" -type l | wc -l

      - name: Build a source tree with real symlinks (nativestrict)
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        continue-on-error: true
        run: |
          SRC="$RUNNER_TEMP/probe-src"
          rm -rf "$SRC"; mkdir -p "$SRC/node_modules/pkg/bin" "$SRC/node_modules/.bin"
          echo 'tool' > "$SRC/node_modules/pkg/bin/tool.js"
          echo '{"name":"pkg"}' > "$SRC/node_modules/pkg/package.json"
          ln -s ../pkg/bin/tool.js  "$SRC/node_modules/.bin/tool" || echo "BIN_LINK_FAIL"
          ln -s ../pkg             "$SRC/node_modules/alias-pkg"  || echo "DIR_LINK_FAIL"
          ln -s ../../does-not-exist "$SRC/node_modules/dangling" || echo "DANGLING_FAIL"
          echo "source symlinks: $(find "$SRC" -type l | wc -l | tr -d ' ')"
          find "$SRC" -type l

      - name: Copy via cp -R (default MSYS)
        shell: bash
        continue-on-error: true
        run: |
          SRC="$RUNNER_TEMP/probe-src"; DST="$RUNNER_TEMP/out-default"
          rm -rf "$DST"; mkdir -p "$DST"
          cp -R "$SRC/." "$DST/" 2>&1 | head -20
          echo "cp exit=${PIPESTATUS[0]}"
          echo "copied symlinks: $(find "$DST" -type l | wc -l | tr -d ' ')"
          echo "copied files:    $(find "$DST" -type f | wc -l | tr -d ' ')"

      - name: Copy via cp -R (MSYS=winsymlinks:nativestrict)
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        continue-on-error: true
        run: |
          SRC="$RUNNER_TEMP/probe-src"; DST="$RUNNER_TEMP/out-native"
          rm -rf "$DST"; mkdir -p "$DST"
          cp -R "$SRC/." "$DST/" 2>&1 | head -20
          echo "cp exit=${PIPESTATUS[0]}"
          echo "copied symlinks: $(find "$DST" -type l | wc -l | tr -d ' ')"
          echo "copied files:    $(find "$DST" -type f | wc -l | tr -d ' ')"

      - name: Copy via tar pipe
        shell: bash
        continue-on-error: true
        run: |
          SRC="$RUNNER_TEMP/probe-src"; DST="$RUNNER_TEMP/out-tar"
          rm -rf "$DST"; mkdir -p "$DST"
          tar -cf - -C "$SRC" . | tar -xf - -C "$DST" 2>&1 | head -20
          echo "copied symlinks: $(find "$DST" -type l | wc -l | tr -d ' ')"
          echo "copied files:    $(find "$DST" -type f | wc -l | tr -d ' ')"

      - name: Copy via Node cpSync verbatimSymlinks
        shell: bash
        continue-on-error: true
        run: |
          SRC="$RUNNER_TEMP/probe-src"; DST="$RUNNER_TEMP/out-node"
          rm -rf "$DST"
          node -e "require('fs').cpSync(process.argv[1], process.argv[2], { recursive: true, verbatimSymlinks: true })" "$SRC" "$DST" 2>&1 | head -20
          echo "node cpSync exit=$?"
          echo "copied symlinks: $(find "$DST" -type l 2>/dev/null | wc -l | tr -d ' ')"
          echo "copied files:    $(find "$DST" -type f 2>/dev/null | wc -l | tr -d ' ')"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows symlink copy probe"
            echo ""
            echo "| mode | symlinks preserved | files |"
            echo "|---|---|---|"
            for m in default native tar node; do
              d="$RUNNER_TEMP/out-$m"
              if [ -d "$d" ]; then
                echo "| $m | $(find "$d" -type l 2>/dev/null | wc -l | tr -d ' ') | $(find "$d" -type f 2>/dev/null | wc -l | tr -d ' ') |"
              else
                echo "| $m | (no output dir) | - |"
              fi
            done
            echo ""
            echo "source had 3 symlinks (1 file link, 1 dir link, 1 dangling)."
          } >> "$GITHUB_STEP_SUMMARY"
