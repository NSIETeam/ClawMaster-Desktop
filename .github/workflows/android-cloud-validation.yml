name: Android Cloud Validation

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/cli/**"
      - "apps/web/**"
      - "apps/desktop-tauri/**"
      - "apps/desktop-defaults/**"
      - "frontends/dsh/**"
      - "frontends/guard/**"
      - "frontends/graph-memory/**"
      - "frontends/notes/**"
      - "frontends/office/**"
      - "frontends/rpa/**"
      - "frontends/updates/**"
      - "packages/**"
      - "native/system/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build.ts"
      - ".github/workflows/android-cloud-validation.yml"

  workflow_dispatch:
    inputs:
      node_build_run_id:
        description: Optional completed Android Node runtime build run ID; omit to build the runtime in this run
        required: false
        default: ""
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: android-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-runtime:
    if: github.event_name != 'workflow_dispatch' || inputs.node_build_run_id == ''
    name: Android Node runtime (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v6

      - name: Install Android NDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Fetch checksum-pinned Node.js source
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://nodejs.org/dist/v22.19.0/node-v22.19.0.tar.xz \
            --output "$RUNNER_TEMP/node-v22.19.0.tar.xz"
          echo '0272acfce50ce9ad060288321b1092719a7f19966f81419835410c59c09daa46  '"$RUNNER_TEMP/node-v22.19.0.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/node-v22.19.0.tar.xz" -C "$RUNNER_TEMP"

      - name: Apply Android V8 compatibility patch
        shell: bash
        run: patch --directory "$RUNNER_TEMP/node-v22.19.0" --strip=1 < apps/android/patches/node-v22.19.0-android-no-execinfo.patch

      - name: Cross-build Node.js for Android
        shell: bash
        run: |
          cd "$RUNNER_TEMP/node-v22.19.0"
          export CC_host=gcc CXX_host=g++ AR_host=gcc-ar
          ./android-configure "$ANDROID_HOME/ndk/28.2.13676358" 26 "${{ matrix.arch }}"
          make -j"$(nproc)" node

      - name: Verify Android ELF alignment and collect runtime files
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          node="$RUNNER_TEMP/node-v22.19.0/out/Release/node"
          case "${{ matrix.arch }}" in
            arm64) libcxx="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ;;
            x86_64) libcxx="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" ;;
          esac
          test -x "$node"
          test -s "$libcxx"
          llvm_readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$llvm_readelf" -lW "$node" | tee node-program-headers.txt
          python3 - <<'PY'
          from pathlib import Path
          headers = Path('node-program-headers.txt').read_text().splitlines()
          loads = [line.split()[-1] for line in headers if line.lstrip().startswith('LOAD ')]
          if not loads:
              raise SystemExit('Node executable has no LOAD segments')
          alignment = [int(value, 0) for value in loads]
          if any(value < 16384 for value in alignment):
              raise SystemExit(f'Node executable is not 16 KB aligned: {alignment}')
          PY
          mkdir -p "node-runtime-${{ matrix.arch }}"
          cp "$node" "node-runtime-${{ matrix.arch }}/node"
          cp "$libcxx" "node-runtime-${{ matrix.arch }}/libc++_shared.so"
          cp node-program-headers.txt "node-runtime-${{ matrix.arch }}/"
          (cd "node-runtime-${{ matrix.arch }}" && sha256sum node libc++_shared.so > SHA256SUMS.txt)

      - name: Run Node.js on a 16 KB Android 16 emulator
        if: matrix.arch == 'x86_64'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: >-
            adb push "$RUNNER_TEMP/node-v22.19.0/out/Release/node" /data/local/tmp/clawmaster-node &&
            adb push "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" /data/local/tmp/libc++_shared.so &&
            adb push apps/android/scripts/node-runtime-smoke.cjs /data/local/tmp/node-runtime-smoke.cjs &&
            adb shell 'LD_LIBRARY_PATH=/data/local/tmp /system/bin/linker64 /data/local/tmp/clawmaster-node /data/local/tmp/node-runtime-smoke.cjs'

      - name: Upload experimental Android Node runtime
        if: always() && hashFiles('node-runtime-*/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: clawmaster-node-android-${{ matrix.arch }}-${{ github.sha }}
          path: node-runtime-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android ${{ matrix.api-level }} ${{ matrix.emulator_arch }} emulator
    needs: node-runtime
    if: always() && (needs.node-runtime.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.node_build_run_id != ''))
    runs-on: ${{ matrix.emulator_arch == 'arm64-v8a' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
        emulator_arch: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@v6

      - name: Resolve Android Node build provenance
        if: github.event_name == 'workflow_dispatch' && inputs.node_build_run_id != ''
        id: node-build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_BUILD_RUN_ID: ${{ inputs.node_build_run_id }}
        run: |
          set -euo pipefail
          metadata="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$NODE_BUILD_RUN_ID")"
          jobs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$NODE_BUILD_RUN_ID/jobs?per_page=100")"
          sha="$(jq -er '.head_sha' <<< "$metadata")"
          x86_job="$(jq -cer '.jobs[] | select(.name == "Android Node runtime (x86_64)")' <<< "$jobs")"
          arm_job="$(jq -cer '.jobs[] | select(.name == "Android Node runtime (arm64)")' <<< "$jobs")"
          test "$(jq -er '.status' <<< "$x86_job")" = completed
          test "$(jq -er '.conclusion' <<< "$x86_job")" = success
          test "$(jq -er '.status' <<< "$arm_job")" = completed
          test "$(jq -er '.conclusion' <<< "$arm_job")" = success
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download Android Node runtimes from this workflow run
        if: github.event_name != 'workflow_dispatch' || inputs.node_build_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: clawmaster-node-android-*-${{ github.sha }}
          path: ${{ runner.temp }}/clawmaster-node

      - name: Download x86_64 Android Node runtime from the completed build
        if: github.event_name == 'workflow_dispatch' && inputs.node_build_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: clawmaster-node-android-x86_64-${{ steps.node-build.outputs.head_sha }}
          path: ${{ runner.temp }}/clawmaster-node-x86_64
          run-id: ${{ inputs.node_build_run_id }}
          github-token: ${{ github.token }}

      - name: Download arm64 Android Node runtime from the completed build
        if: github.event_name == 'workflow_dispatch' && inputs.node_build_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: clawmaster-node-android-arm64-${{ steps.node-build.outputs.head_sha }}
          path: ${{ runner.temp }}/clawmaster-node-arm64
          run-id: ${{ inputs.node_build_run_id }}
          github-token: ${{ github.token }}

      - name: Package Android Node runtimes for app-process validation
        shell: bash
        env:
          NODE_BUILD_RUN_ID: ${{ inputs.node_build_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$NODE_BUILD_RUN_ID" ]]; then
            declare -A runtime_paths=(
              [arm64]="$RUNNER_TEMP/clawmaster-node-arm64"
              [x86_64]="$RUNNER_TEMP/clawmaster-node-x86_64"
            )
            for arch in arm64 x86_64; do
              case "$arch" in arm64) abi=arm64-v8a ;; x86_64) abi=x86_64 ;; esac
              jni="apps/android/app/src/main/jniLibs/$abi"
              mkdir -p "$jni"
              install -m 0755 "${runtime_paths[$arch]}/node" "$jni/libclawmaster_node.so"
              install -m 0644 "${runtime_paths[$arch]}/libc++_shared.so" "$jni/libc++_shared.so"
            done
          else
            for arch in arm64 x86_64; do
              case "$arch" in
                arm64) abi=arm64-v8a ;;
                x86_64) abi=x86_64 ;;
              esac
              runtime="$RUNNER_TEMP/clawmaster-node/clawmaster-node-android-$arch-$GITHUB_SHA"
              jni="apps/android/app/src/main/jniLibs/$abi"
              mkdir -p "$jni"
              install -m 0755 "$runtime/node" "$jni/libclawmaster_node.so"
              install -m 0644 "$runtime/libc++_shared.so" "$jni/libc++_shared.so"
            done
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Install locked ClawMaster workspace dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          for frontend in dsh office notes graph-memory guard rpa updates; do
            npm ci --prefix "frontends/$frontend" --ignore-scripts
          done

      - name: Build desktop client and Android DSH payload on this runner
        env:
          DSH_DESKTOP_BUILD_MODE: release
          DSH_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          pnpm run build
          npm run build --prefix frontends/dsh
          npm run build --prefix frontends/office
          npm run build --prefix frontends/notes
          npm run build --prefix frontends/graph-memory
          npm run build --prefix frontends/guard
          npm run build --prefix frontends/rpa
          npm run build --prefix frontends/updates
          case "$(uname -m)" in
            aarch64) rpa_target=aarch64-unknown-linux-gnu ;;
            x86_64) rpa_target=x86_64-unknown-linux-gnu ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          rustup target add "$rpa_target"
          node apps/desktop-tauri/scripts/prepare-rpa-native.mjs --target "$rpa_target"
          pnpm --dir apps/desktop-tauri run build:harness

      - name: Add checksummed desktop DSH and npm payloads to validation APK
        shell: bash
        run: |
          set -euo pipefail
          node_archive="$RUNNER_TEMP/node-v22.19.0.tar.xz"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.19.0/node-v22.19.0.tar.xz --output "$node_archive"
          echo '0272acfce50ce9ad060288321b1092719a7f19966f81419835410c59c09daa46  '"$node_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/node-source" apps/android/app/src/main/assets/dsh
          tar -xJf "$node_archive" --strip-components=1 -C "$RUNNER_TEMP/node-source"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          assets = pathlib.Path('apps/android/app/src/main/assets/dsh')
          harness = pathlib.Path('apps/desktop-tauri/bundled/harness')
          manifest = json.loads((harness / '.bundle-manifest.json').read_text())
          with zipfile.ZipFile(assets / 'harness.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for item in sorted(harness.rglob('*')):
                  if item.is_file():
                      archive.write(item, item.relative_to(harness).as_posix())
          harness_metadata = {
              'archiveSha256': hashlib.sha256((assets / 'harness.zip').read_bytes()).hexdigest(),
              'contentSha256': manifest['contentSha256'],
              'harnessVersion': manifest['harnessVersion'],
              'desktopVersion': manifest['desktopVersion'],
          }
          (assets / 'harness.zip.json').write_text(json.dumps(harness_metadata, sort_keys=True) + '\n')
          npm_root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'node-source/deps/npm'
          with zipfile.ZipFile(assets / 'npm.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for item in sorted(npm_root.rglob('*')):
                  if item.is_file():
                      archive.write(item, item.relative_to(npm_root).as_posix())
          npm_metadata = {
              'archiveSha256': hashlib.sha256((assets / 'npm.zip').read_bytes()).hexdigest(),
              'npmVersion': json.loads((npm_root / 'package.json').read_text())['version'],
          }
          (assets / 'npm.zip.json').write_text(json.dumps(npm_metadata, sort_keys=True) + '\n')
          PY

      - name: Create disposable validation signing key
        shell: bash
        run: |
          key="$RUNNER_TEMP/android-validation.jks"
          keytool -genkeypair -v -keystore "$key" -storepass validation-only -keypass validation-only \
            -alias clawmaster -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=ClawMaster CI Validation, OU=Temporary, O=ClawMaster, C=CN"
          echo "ANDROID_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=validation-only" >> "$GITHUB_ENV"

      - name: Run core tests, lint, and release build
        run: gradle -p apps/android :core:test :app:lintRelease :app:assembleRelease

      - name: Verify APK signature and record checksum
        shell: bash
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee android-signature.txt
          sha256sum "$apk" | tee android-sha256.txt

      - name: Enable hardware-accelerated Android emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise the release app on a cloud emulator
        if: github.event_name != 'workflow_dispatch' || inputs.node_build_run_id == ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.emulator_arch }}
          profile: pixel_7_pro
          disable-animations: true
          script: >-
            gradle -p apps/android :app:connectedReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=team.nsi.clawmaster.android.StandaloneAgentTest,team.nsi.clawmaster.android.WorkspaceAgentTest,team.nsi.clawmaster.android.AndroidNodeProcessTest,team.nsi.clawmaster.android.DshParityTest

      - name: Run Android Node from the application UID on a cloud emulator
        if: github.event_name == 'workflow_dispatch' && inputs.node_build_run_id != ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.emulator_arch }}
          profile: pixel_7_pro
          disable-animations: true
          script: >-
            gradle -p apps/android :app:connectedReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=team.nsi.clawmaster.android.AndroidNodeProcessTest,team.nsi.clawmaster.android.DshParityTest
