name: ClawMaster Desktop Release

on:
  push:
    tags:
      - desktop-v*
  workflow_dispatch:
    inputs:
      tag:
        description: desktop-v* version tag; build-only runs use the selected branch
        required: true
        default: desktop-v0.2.2
      publish:
        description: Publish an existing version tag after all platform checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  DSH_DESKTOP_BUILD_MODE: release
  DSH_REQUIRE_FULL_CORE: '1'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.asset_platform }}-${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset_platform: windows
            asset_arch: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            asset_platform: macos
            asset_arch: arm64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            asset_platform: linux
            asset_arch: x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.sha || env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release version
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/desktop-tauri/scripts/release-channel.mjs $env:RELEASE_TAG

      - name: Verify macOS acceptance prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: node apps/desktop-tauri/scripts/verify-macos-native.mjs --preflight

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils musl-tools gnome-keyring libglib2.0-bin dbus

      - name: Require clean release source
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/desktop-tauri/scripts/build-provenance.mjs

      - name: Install Rust target
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          rustup target add ${{ matrix.target }}

      - name: Install workspace dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile

      - name: Install product frontend build dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --prefix frontends/dsh --ignore-scripts
          npm ci --prefix frontends/office --ignore-scripts
          npm ci --prefix frontends/notes --ignore-scripts
          npm ci --prefix frontends/graph-memory --ignore-scripts
          npm ci --prefix frontends/guard --ignore-scripts
          npm ci --prefix frontends/rpa --ignore-scripts
          npm ci --prefix frontends/updates --ignore-scripts

      - name: Verify Notes storage, approval and rendered client
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          npm test --prefix frontends/notes
          npm run typecheck --prefix frontends/notes
          pnpm run test:notes-client

      # Stage the per-platform runtime the installer ships so first boot needs
      # no network: the bundled core runs in place with this Node and pnpm.
      - name: Stage bundled Node/pnpm runtime
        run: |
          $rt = "apps/desktop-tauri/bundled/runtime"
          New-Item -ItemType Directory -Force "$rt/pnpm" | Out-Null
          npm install --prefix "$rt/.pnpm-tmp" pnpm@11.7.0 --no-audit --no-fund --loglevel=error
          Copy-Item "$rt/.pnpm-tmp/node_modules/pnpm/bin/pnpm.cjs" "$rt/pnpm/pnpm.cjs"
          Remove-Item -Recurse -Force "$rt/.pnpm-tmp"
          Add-Content $env:GITHUB_ENV "DSH_PNPM_CJS=$((Resolve-Path "$rt/pnpm/pnpm.cjs").Path)"

      - name: Build ClawMaster harness
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm exec vitest run scripts/tsdown-config.spec.ts
          pnpm --dir apps/desktop-tauri run build:harness

      - name: Verify WatchDog business writes and task admission
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          npm test --prefix frontends/dsh
          npm run typecheck --prefix frontends/dsh

      - name: Verify collapsed process details and approvals
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm exec vitest run packages/client/ui-chat/tests/clawmaster-disclosures.client.spec.tsx packages/client/ui-chat/tests/chat-branch-tails.client.spec.tsx packages/client/ui-chat/tests/chat-view.client.spec.tsx packages/client/ui-tool/tests/terminal-card.client.spec.tsx packages/client/ui-tool/tests/tool-row.client.spec.tsx packages/client/ui-chat/tests/turn-process-running.client.spec.ts packages/client/ui-chat/tests/conversation-node-definitions.client.spec.ts packages/client/ui-chat/tests/system-prompt-row.client.spec.tsx packages/client/ui-chat/tests/approval-command.client.spec.tsx packages/client/ui-approval/tests/ui-approval.client.spec.tsx

      - name: Verify sidebar close and replacement lifecycle
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm exec vitest run packages/client/ui-sidebar-right/tests/service.client.spec.ts packages/client/ui-sidebar-right/tests/seat.client.spec.tsx packages/client/ui-sidebar-right/tests/guide-body.client.spec.tsx

      - name: Verify Guard control plane
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          npm test --prefix frontends/guard
          npm run typecheck --prefix frontends/guard

      - name: Verify immutable updater component
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check --prefix frontends/updates
          npm run typecheck --prefix frontends/updates
          npm test --prefix frontends/updates

      - name: Build and verify native RPA helper
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/desktop-tauri/scripts/prepare-rpa-native.mjs --target ${{ matrix.target }} --smoke

      - name: Verify RPA control plane and distributed native bridge
        shell: pwsh
        env:
          CLAWMASTER_REQUIRE_NATIVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_OS -eq 'Linux') {
            dbus-run-session -- bash apps/desktop-tauri/scripts/with-linux-keyring.sh npm test --prefix frontends/rpa
          } else {
            npm test --prefix frontends/rpa
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native RPA bridge acceptance failed' }
          npm run typecheck --prefix frontends/rpa
          if ($LASTEXITCODE -ne 0) { throw 'Native RPA types failed' }

      - name: Verify Graph Memory component
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix frontends/graph-memory test
          npm --prefix frontends/graph-memory run typecheck
          npm --prefix frontends/graph-memory run check

      - name: Verify provenance and plugin rejection cases
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm --dir apps/desktop-tauri run test:bundle
          pnpm --dir apps/desktop-tauri run test:update-manifest
          node --test apps/desktop-tauri/scripts/windows-native-evidence.test.mjs apps/desktop-tauri/scripts/verify-macos-native.test.mjs apps/desktop-tauri/scripts/with-linux-keyring.test.mjs
          node --test apps/desktop-tauri/sys-prompt/tests/assembly.test.mjs

      - name: Verify Linux package permission rejection cases
        if: runner.os == 'Linux'
        shell: bash
        run: node --test apps/desktop-tauri/scripts/verify-linux-package.test.mjs

      - name: Build complete Linux sandbox binaries
        if: runner.os == 'Linux'
        shell: bash
        run: node --import tsx/esm native/system/scripts/build.ts

      - name: Replay WeChat approvals and unavailable update targets
        if: runner.os == 'macOS' || runner.os == 'Linux'
        shell: bash
        run: >-
          pnpm exec vitest run --config vitest.snapshot.config.ts snapshots/acp/acp.snapshot.ts -t 'snapshot: (wechat-read-(approved|rejected)|updater-intel-unavailable) matches|snapshot fixtures'

      - name: Prepare verified Office editor resources
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          node --test apps/desktop-tauri/scripts/prepare-office-runtime.test.mjs
          node apps/desktop-tauri/scripts/prepare-office-runtime.mjs

      - name: Build desktop bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm --dir apps/desktop-tauri exec tauri build --target ${{ matrix.target }} --bundles '${{ matrix.bundles }}' ${{ runner.os == 'Linux' && '--verbose' || '' }}

      - name: Verify prepared payload
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/desktop-tauri/scripts/bundle-harness-source.mjs --check

      - name: Verify desktop runtime and controlled updates
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --deep --strict apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ClawMaster.app

      - name: Verify installed macOS desktop and normal relaunch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node apps/desktop-tauri/scripts/verify-macos-native.mjs \
            --app "$GITHUB_WORKSPACE/apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ClawMaster.app" \
            --prepared-root "$GITHUB_WORKSPACE/apps/desktop-tauri/bundled/harness" \
            --expected-version "$(node -p 'JSON.parse(require("node:fs").readFileSync("apps/desktop-tauri/package.json","utf8")).version')" \
            --output "$GITHUB_WORKSPACE/native-acceptance/macos-${{ matrix.asset_arch }}-native-acceptance.json"

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: macos-${{ matrix.asset_arch }}-native-acceptance
          path: native-acceptance/macos-${{ matrix.asset_arch }}-native-acceptance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify installed Windows desktop and normal relaunch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          $installers = @(Get-ChildItem 'apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis' -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $version = (Get-Content apps/desktop-tauri/package.json -Raw | ConvertFrom-Json).version
          & ./apps/desktop-tauri/scripts/verify-windows-native.ps1 -Installer $installers[0].FullName -PreparedRoot ./apps/desktop-tauri/bundled/harness -ExpectedVersion $version -OutputPath ./native-acceptance/windows-native-acceptance.json

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-native-acceptance
          path: native-acceptance/windows-native-acceptance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify extracted Linux installers and Host restart
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          task_bundle="$GITHUB_WORKSPACE/apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          task_root=$(mktemp -d "$RUNNER_TEMP/ClawMaster 验收 # XXXXXX")
          trap 'rm -rf "$task_root"' EXIT
          task_appimage=$(find "$task_bundle/appimage" -maxdepth 1 -name '*.AppImage' -type f -print -quit)
          task_deb=$(find "$task_bundle/deb" -maxdepth 1 -name '*.deb' -type f -print -quit)
          test -n "$task_appimage" && test -n "$task_deb"
          mkdir "$task_root/appimage" "$task_root/deb"
          (cd "$task_root/appimage" && "$task_appimage" --appimage-extract > /dev/null)
          dpkg-deb --extract "$task_deb" "$task_root/deb"
          for task_format in appimage deb; do
            task_extracted="$task_root/$task_format"
            if [ "$task_format" = appimage ]; then task_extracted="$task_extracted/squashfs-root"; fi
            task_payload=$(node apps/desktop-tauri/scripts/verify-linux-package.mjs --package-root "$task_extracted" --prepared-root apps/desktop-tauri/bundled/harness --arch x64)
            task_smoke="$task_root/production $task_format"
            cp -a "$task_payload" "$task_smoke"
            (cd "$task_smoke" && pnpm install --prod --frozen-lockfile)
            node apps/desktop-tauri/scripts/prepare-rpa-native.mjs --root "$task_smoke" --target ${{ matrix.target }} --check --smoke
            DSH_DESKTOP_SMOKE_ROOT="$task_smoke" node --test apps/desktop-tauri/scripts/desktop-plugin-install.test.mjs apps/desktop-tauri/scripts/harness-startup.test.mjs
            DSH_DESKTOP_SMOKE_ROOT="$task_smoke" pnpm exec vitest run --config frontends/dsh/tests/vitest.navigation.config.ts
            DSH_DESKTOP_SMOKE_ROOT="$task_smoke" pnpm exec vitest run --config apps/desktop-tauri/scripts/vitest.sidebar.config.ts
          done

      - name: Verify fresh production installation and Host restart
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("ClawMaster 验收 # " + [guid]::NewGuid().ToString())
          Copy-Item apps/desktop-tauri/bundled/harness $smokeRoot -Recurse
          try {
            Push-Location $smokeRoot
            try {
              pnpm install --prod --frozen-lockfile
              if ($LASTEXITCODE -ne 0) { throw "Production dependency installation failed" }
            } finally { Pop-Location }
            node apps/desktop-tauri/scripts/prepare-rpa-native.mjs --root $smokeRoot --target ${{ matrix.target }} --check --smoke
            if ($LASTEXITCODE -ne 0) { throw "Distributed RPA helper acceptance failed" }
            $env:DSH_DESKTOP_SMOKE_ROOT = $smokeRoot
            node --test apps/desktop-tauri/scripts/desktop-plugin-install.test.mjs apps/desktop-tauri/scripts/harness-startup.test.mjs
            if ($LASTEXITCODE -ne 0) { throw "Packaged Host acceptance failed" }
            pnpm exec vitest run --config frontends/dsh/tests/vitest.navigation.config.ts
            if ($LASTEXITCODE -ne 0) { throw "Packaged WatchDog interaction acceptance failed" }
            pnpm exec vitest run --config apps/desktop-tauri/scripts/vitest.sidebar.config.ts
            if ($LASTEXITCODE -ne 0) { throw "Packaged editor interaction acceptance failed" }
          } finally { Remove-Item $smokeRoot -Recurse -Force }

      - name: Stage release assets
        shell: pwsh
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_PLATFORM: ${{ matrix.asset_platform }}
          RUST_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $bundleRoot = "apps/desktop-tauri/src-tauri/target/$env:RUST_TARGET/release/bundle"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item apps/desktop-tauri/bundled/harness/.bundle-manifest.json "release-assets/clawmaster-$version-$env:ASSET_PLATFORM-$env:ASSET_ARCH-build.json"

          if ($env:ASSET_PLATFORM -eq 'windows') {
            $source = Get-ChildItem $bundleRoot -Recurse -File -Filter '*-setup.exe' | Select-Object -First 1
            if (-not $source) { throw "NSIS installer not found under $bundleRoot" }
            $signature = Get-Item "$($source.FullName).sig" -ErrorAction Stop
            $destination = "release-assets/clawmaster-$version-windows-$env:ASSET_ARCH-setup.exe"
            Copy-Item $source.FullName $destination
            Copy-Item $signature.FullName "$destination.sig"
          }
          elseif ($env:ASSET_PLATFORM -eq 'macos') {
            $source = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.dmg' | Select-Object -First 1
            $updater = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.app.tar.gz' | Select-Object -First 1
            if (-not $source -or -not $updater) { throw "DMG or updater archive not found under $bundleRoot" }
            $signature = Get-Item "$($updater.FullName).sig" -ErrorAction Stop
            Copy-Item $source.FullName "release-assets/clawmaster-$version-macos-$env:ASSET_ARCH.dmg"
            $updaterDestination = "release-assets/clawmaster-$version-macos-$env:ASSET_ARCH.app.tar.gz"
            Copy-Item $updater.FullName $updaterDestination
            Copy-Item $signature.FullName "$updaterDestination.sig"
          }
          else {
            $appImage = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.AppImage' | Select-Object -First 1
            $deb = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.deb' | Select-Object -First 1
            if (-not $appImage -or -not $deb) { throw "Linux AppImage or deb not found under $bundleRoot" }
            $signature = Get-Item "$($appImage.FullName).sig" -ErrorAction Stop
            $appImageDestination = "release-assets/clawmaster-$version-linux-$env:ASSET_ARCH.AppImage"
            Copy-Item $appImage.FullName $appImageDestination
            Copy-Item $signature.FullName "$appImageDestination.sig"
            $debDestination = "release-assets/clawmaster-$version-linux-$env:ASSET_ARCH.deb"
            Copy-Item $deb.FullName $debDestination
            pnpm --dir apps/desktop-tauri exec tauri signer sign (Join-Path $env:GITHUB_WORKSPACE $debDestination)
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$debDestination.sig")) {
              throw "DEB updater signature was not generated"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset_platform }}-${{ matrix.asset_arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.sha || env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Resolve publication channel
        id: channel
        run: node apps/desktop-tauri/scripts/release-channel.mjs "$RELEASE_TAG"

      - name: Verify release asset set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          $expected = @(
            '*-windows-x64-setup.exe',
            '*-windows-x64-setup.exe.sig',
            '*-macos-arm64.dmg',
            '*-macos-arm64.app.tar.gz',
            '*-macos-arm64.app.tar.gz.sig',
            '*-linux-x64.AppImage',
            '*-linux-x64.AppImage.sig',
            '*-linux-x64.deb',
            '*-linux-x64.deb.sig',
            '*-windows-x64-build.json',
            '*-macos-arm64-build.json',
            '*-linux-x64-build.json'
          )
          foreach ($pattern in $expected) {
            if (-not (Get-ChildItem release-assets -File -Filter $pattern)) {
              throw "Missing release asset matching $pattern"
            }
          }
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          foreach ($file in Get-ChildItem release-assets -File -Filter '*-build.json') {
            $manifest = Get-Content $file.FullName | ConvertFrom-Json
            $build = $manifest.buildProvenance
            if ($manifest.desktopVersion -ne $version -or $manifest.contentSha256 -notmatch '^[a-f0-9]{64}$' -or $build.schemaVersion -ne 1 -or $build.mode -ne 'release' -or $build.source.dirty -ne $false -or $build.source.dirtyFiles.Count -ne 0 -or $build.source.gitCommit -ne $commit -or $build.source.gitTree -ne $tree) {
              throw "Build provenance does not match clean release source: $($file.Name)"
            }
          }

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required' }
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          node apps/desktop-tauri/scripts/generate-updater-manifest.mjs `
            --assets-dir release-assets `
            --output release-assets/latest.json `
            --version $version `
            --target-set current `
            --repository $env:GITHUB_REPOSITORY `
            --release-tag $env:RELEASE_TAG `
            --notes-file apps/desktop-tauri/release-notes.md `
            --pub-date $publishedAt

      - name: Verify updater signatures before publication
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq minisign
          node --test apps/desktop-tauri/scripts/verify-updater-signatures.test.mjs apps/desktop-tauri/scripts/sync-updater-channel.test.mjs
          node apps/desktop-tauri/scripts/verify-updater-signatures.mjs release-assets release-assets/latest.json apps/desktop-tauri/release-signing.pub

      - name: Record release checksums
        run: |
          cp apps/desktop-tauri/release-signing.pub release-assets/clawmaster-release-signing.pub
          node apps/desktop-tauri/scripts/release-checksums.mjs release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.channel.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          RELEASE_LATEST: ${{ steps.channel.outputs.latest }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_PRERELEASE" = false ]; then
              echo "A stable release already exists; publish a new version instead of replacing its files."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file apps/desktop-tauri/release-notes.md --prerelease="$RELEASE_PRERELEASE" --latest="$RELEASE_LATEST"
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TITLE" --notes-file apps/desktop-tauri/release-notes.md --prerelease="$RELEASE_PRERELEASE" --latest="$RELEASE_LATEST"
          fi
