name: Windows installed desktop validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-desktop:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Parse native script and reject invalid observations
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'apps/desktop-tauri/scripts/verify-windows-native.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          node --test apps/desktop-tauri/scripts/windows-native-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native evidence tests failed.' }
      - name: Download and verify the public beta.6 Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadRoot = Join-Path $env:RUNNER_TEMP ('native-published-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null
          gh release download desktop-v0.2.0-beta.6 --repo NSIETeam/ClawMaster-Desktop --dir $downloadRoot --pattern clawmaster-0.2.0-beta.6-windows-x64-setup.exe --pattern clawmaster-0.2.0-beta.6-windows-x64-build.json --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Public release download failed.' }
          $sumsPath = Join-Path $downloadRoot 'SHA256SUMS.txt'
          if ((Get-FileHash $sumsPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne '267971e9a91a8e9ccb8457e55e598dc3bf4d5b099c1873f22d3411c9f83faf57') { throw 'Published checksums file differs from the release asset digest.' }
          $sums = Get-Content -LiteralPath $sumsPath
          foreach ($name in @('clawmaster-0.2.0-beta.6-windows-x64-setup.exe', 'clawmaster-0.2.0-beta.6-windows-x64-build.json')) {
            $rows = @($sums | Where-Object { $_ -match ('^[a-f0-9]{64}  ' + [regex]::Escape($name) + '$') })
            if ($rows.Count -ne 1) { throw "Missing or duplicate checksum for $name" }
            if ((Get-FileHash (Join-Path $downloadRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $rows[0].Substring(0, 64)) { throw "Downloaded bytes differ: $name" }
          }
          Copy-Item (Join-Path $downloadRoot 'clawmaster-0.2.0-beta.6-windows-x64-build.json') (Join-Path $downloadRoot '.bundle-manifest.json')
          $manifest = Get-Content (Join-Path $downloadRoot '.bundle-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.buildProvenance.source.gitCommit -ne '197bb5c07371fb5eafd58425f731351cd84d4c3f') { throw 'Unexpected beta.6 source commit.' }
          "NATIVE_PUBLISHED_ROOT=$downloadRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install, open, close and reopen the published desktop
        shell: pwsh
        run: |
          & ./apps/desktop-tauri/scripts/verify-windows-native.ps1 -Installer (Join-Path $env:NATIVE_PUBLISHED_ROOT 'clawmaster-0.2.0-beta.6-windows-x64-setup.exe') -PreparedRoot $env:NATIVE_PUBLISHED_ROOT -ExpectedVersion '0.2.0-beta.6' -OutputPath (Join-Path $PWD 'native-validation/windows-native-acceptance.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-beta6-acceptance
          path: native-validation/*.json
          if-no-files-found: warn
